name: Build AirGlide Windows
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum
      - name: Generate branded icons
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 192 -h 192 source/web/icon.svg -o source/web/icon-192.png
          rsvg-convert -w 512 -h 512 source/web/icon.svg -o source/web/icon-512.png
          rsvg-convert -w 180 -h 180 source/web/icon.svg -o source/web/apple-touch-icon.png
      - name: Test
        working-directory: source
        run: |
          go test ./...
          node --test tests/motion.test.js
      - name: Cross-compile Windows executable
        working-directory: source
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -buildvcs=false -ldflags="-s -w" -o ../AirGlide.exe .
      - name: Package Windows distribution
        run: |
          mkdir -p dist
          cp AirGlide.exe START.cmd START-HERE.html README.md Enable-Private-Network.* LICENSE *-NOTICES.txt WORDMARK-FONT-LICENSE.txt dist/
          cp source/web/icon.svg dist/airglide-logo.svg
          cd dist
          sha256sum AirGlide.exe > SHA256SUMS.txt
          zip -q ../AirGlide-Windows.zip *
          unzip -t ../AirGlide-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: AirGlide-Windows.zip
          if-no-files-found: error

  publish:
    needs: windows-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
      - name: Publish new companion versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^const version = "\([0-9.]*\)"/\1/p' source/main.go)
          test -n "$version"
          if ! gh release view "v$version" >/dev/null 2>&1; then
            gh release create "v$version" AirGlide-Windows.zip --target "$GITHUB_SHA" --title "AirGlide $version for Windows" --notes "Extract AirGlide-Windows.zip and run START.cmd. See START-HERE.html for phone setup."
          fi
          mkdir -p "$RUNNER_TEMP/airglide-release"
          gh release download "v$version" --pattern AirGlide-Windows.zip --dir "$RUNNER_TEMP/airglide-release"
          (cd "$RUNNER_TEMP/airglide-release" && unzip -q AirGlide-Windows.zip AirGlide.exe SHA256SUMS.txt && sha256sum --check SHA256SUMS.txt)
          cp "$RUNNER_TEMP/airglide-release/AirGlide.exe" AirGlide.exe
          git add -- AirGlide.exe
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Include verified AirGlide $version executable in repository downloads"
            git push origin HEAD:main
          fi
