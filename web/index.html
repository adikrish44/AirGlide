<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AirGlide Remote</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif}*{box-sizing:border-box}body{margin:0;background:#10131b;color:#f7f8ff}main{max-width:560px;margin:auto;padding:24px}h1{letter-spacing:-.05em;font-size:36px;margin:12px 0}p,small{color:#aab3c6}button,input{border:1px solid #394252;border-radius:14px;padding:14px;font:inherit;color:inherit;background:#222a39}button{cursor:pointer;touch-action:manipulation}button:active{background:#3c5576}input{min-width:0;width:100%}.row{display:flex;gap:10px;margin-top:12px}.row>*{flex:1}#pad{height:46vh;min-height:240px;max-height:430px;border:1px solid #384355;border-radius:26px;background:linear-gradient(145deg,#202c41,#151c29);touch-action:none;display:grid;place-items:center;color:#8396b6;margin-top:18px;user-select:none}.hidden{display:none}footer{margin-top:32px;text-align:center;font-size:12px}a{color:#a8c8ff}
</style></head><body><main>
<h1>AirGlide</h1><p>Control your Windows PC from your phone.</p>
<section id="pair"><p>Enter the code displayed on Windows.</p><div class="row"><input id="code" inputmode="numeric" maxlength="6" placeholder="6-digit pairing code"><button id="connect">Connect</button></div></section>
<section id="remote" class="hidden"><div id="pad">Glide to move cursor</div>
<div class="row"><button data-click="left">Left click</button><button data-click="right">Right click</button></div>
<div class="row"><button data-scroll="3">Scroll up</button><button data-scroll="-3">Scroll down</button></div>
<div class="row"><input id="text" placeholder="Type on your PC"><button id="send">Send</button></div>
<div class="row"><button data-key="enter">Enter</button><button data-key="backspace">⌫</button><button data-key="esc">Esc</button></div></section>
<p id="status">Not connected</p>
<footer>Created by Aditya Krishna Thota · <a href="https://instagram.com/adi__krish" target="_blank" rel="noopener">@adi__krish</a></footer></main>
<script>
let ws, last=null;
const status=document.querySelector('#status');
function send(obj){if(ws?.readyState===WebSocket.OPEN)ws.send(JSON.stringify(obj))}
document.querySelector('#connect').onclick=()=>{
ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');
ws.onopen=()=>send({type:'pair',code:document.querySelector('#code').value});
ws.onmessage=e=>{let m=JSON.parse(e.data);if(m.type==='paired'){document.querySelector('#pair').classList.add('hidden');document.querySelector('#remote').classList.remove('hidden');status.textContent='Connected'}else if(m.type==='error')status.textContent=m.message};
ws.onclose=()=>{status.textContent='Disconnected';document.querySelector('#pair').classList.remove('hidden');document.querySelector('#remote').classList.add('hidden')};
};
const pad=document.querySelector('#pad');
pad.addEventListener('pointerdown',e=>{last={x:e.clientX,y:e.clientY};pad.setPointerCapture(e.pointerId)});
pad.addEventListener('pointermove',e=>{if(!last)return;send({type:'move',dx:(e.clientX-last.x)*1.5,dy:(e.clientY-last.y)*1.5});last={x:e.clientX,y:e.clientY}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])pad.addEventListener(event,()=>last=null);
document.querySelectorAll('[data-click]').forEach(b=>b.onclick=()=>send({type:'click',button:b.dataset.click}));
document.querySelectorAll('[data-scroll]').forEach(b=>b.onclick=()=>send({type:'scroll',amount:Number(b.dataset.scroll)}));
document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>send({type:'key',key:b.dataset.key}));
document.querySelector('#send').onclick=()=>{let i=document.querySelector('#text');send({type:'text',value:i.value});i.value=''};
</script></body></html>
